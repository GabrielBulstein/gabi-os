  <script>
    'use strict';
    const SVG = {grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',check:'<path d="m20 6-11 11-5-5"/>',list:'<path d="m9 6 2 2 4-4"/><path d="M9 17h10M9 12h10M4 17h.01M4 12h.01"/>',dumbbell:'<path d="m6.5 6.5 11 11m3-3-6 6m-11-11 6-6M3 13l10 8M13 3l8 10"/>',layers:'<rect width="12" height="12" x="6" y="6" rx="2"/><path d="M3 10V5a2 2 0 0 1 2-2h5M14 21h5a2 2 0 0 0 2-2v-5"/>',settings:'<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-1.91 1.91-.06-.06A1.65 1.65 0 0 0 16 18.4a1.65 1.65 0 0 0-1 .5 1.65 1.65 0 0 0-.5 1V21.5h-3V19.9a1.65 1.65 0 0 0-1.5-1.5 1.65 1.65 0 0 0-1.82.33l-.06.06-1.91-1.91.06-.06A1.65 1.65 0 0 0 6.6 15a1.65 1.65 0 0 0-.5-1 1.65 1.65 0 0 0-1-.5H3.5v-3H5.1a1.65 1.65 0 0 0 1.5-1.5 1.65 1.65 0 0 0-.33-1.82l-.06-.06 1.91-1.91.06.06A1.65 1.65 0 0 0 10 5.6a1.65 1.65 0 0 0 1-.5 1.65 1.65 0 0 0 .5-1V2.5h3v1.6A1.65 1.65 0 0 0 16 5.6a1.65 1.65 0 0 0 1.82-.33l.06-.06 1.91 1.91-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 .5 1 1.65 1.65 0 0 0 1 .5h1.6v3h-1.6a1.65 1.65 0 0 0-1.5 1.5Z"/>',bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7l1-8"/>',plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M3 6h18M8 6V4h8v2m3 0-1 15H6L5 6m5 4v7m4-7v7"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',briefcase:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12a21 21 0 0 0 18 0"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 17v4h16v-4"/>',upload:'<path d="M12 16V4m-4 4 4-4 4 4M4 17v4h16v-4"/>',mic:'<path d="M12 18v4m-5 0h10M12 14a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4Zm-7-4a7 7 0 0 0 14 0"/>',volume:'<path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>',play:'<path d="m8 5 12 7-12 7V5"/>',pause:'<path d="M8 5v14M16 5v14"/>',reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',spark:'<path d="m12 3 1.6 6.4L20 11l-6.4 1.6L12 19l-1.6-6.4L4 11l6.4-1.6L12 3Z"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',edit:'<path d="m16 4 4 4-12 12H4v-4L16 4ZM14 6l4 4"/>',copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>',shield:'<path d="M12 22s9-4 9-11V5l-9-3-9 3v6c0 7 9 11 9 11Z"/><path d="m9 12 2 2 4-4"/>'};
    const ico = (name, size=18) => `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${SVG[name]||SVG.grid}</svg>`;
    const navItems=[['overview','Panel','grid'],['study','Universidad','book'],['tasks','Tareas y agenda','list'],['training','Entrenamiento','dumbbell'],['projects','Proyectos','layers'],['settings','Configuración','settings']];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const pad=n=>String(n).padStart(2,'0');
    const dateISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
    const defaultData={version:1,tasks:[{id:'t1',name:'Practicar exposición oral de Inglés III',area:'Universidad',priority:'Alta',due:'2026-10-27',done:false},{id:'t2',name:'Estudiar Redes — 30 minutos',area:'Universidad',priority:'Media',due:'',done:false},{id:'t3',name:'Repasar Algoritmos II — Unidad 1',area:'Universidad',priority:'Media',due:'',done:false}],subjects:[{id:'s1',name:'Redes',percent:8,description:'Desde cero · Packet Tracer'},{id:'s2',name:'Algoritmos y Estructuras II',percent:12,description:'Empezar por Unidad 1'},{id:'s3',name:'Ingeniería de Software II',percent:10,description:'Retomar desde fundamentos'},{id:'s4',name:'Base de Datos',percent:75,description:'Al día · mantener seguimiento'},{id:'s5',name:'Inglés III',percent:55,description:'Exposición oral · 27 de octubre'}],projects:[{id:'p1',name:'Proyecto Gabito',description:'Asistente personal en WhatsApp. Operativo; mejoras futuras pendientes.',status:'En uso'},{id:'p2',name:'Primer empleo IT',description:'Búsqueda de soporte técnico, mesa de ayuda y sistemas junior.',status:'En progreso'},{id:'p3',name:'Proyecto Centinela',description:'Laboratorio personal para aprender ciberseguridad.',status:'En pausa'}],gym:{},sessions:[],notes:'',weeklyGoal:4};
    const clone=obj=>JSON.parse(JSON.stringify(obj));
    function readData(){try{const value=localStorage.getItem('gabi-os-v1');if(!value)return clone(defaultData);const s=JSON.parse(value);if(!s||!Array.isArray(s.tasks)||!Array.isArray(s.projects)||!Array.isArray(s.subjects)||!Array.isArray(s.sessions)||typeof s.gym!=='object'||s.gym===null)throw Error('formato inválido');return {...clone(defaultData),...s};}catch(e){return clone(defaultData)}}
    let state=readData(),currentView='overview',taskFilter='Todas',focusLength=30,focusRemaining=30*60,focusRunning=false,focusInterval=null,focusDeadline=null,notesDebounce=null,toastTimeout=null;
    function save(){try{localStorage.setItem('gabi-os-v1',JSON.stringify(state))}catch(e){toast('No fue posible guardar: revisá el almacenamiento del navegador')}}
    const today=()=>dateISO();
    function weekStart(){const d=new Date();let dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return dateISO(d)}
    function past7(){const arr=[];for(let k=6;k>=0;k--){let d=new Date();d.setDate(d.getDate()-k);arr.push(dateISO(d))}return arr}
    const gymCount=()=>Object.values(state.gym[weekStart()]||{}).filter(Boolean).length;
    const weeklyStudy=()=>{const monday=weekStart();return state.sessions.filter(s=>s.date>=monday).reduce((acc,s)=>acc+Number(s.minutes||0),0)};
    const elapsedStr=m=>`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`;
    const shortDate=s=>{if(!s)return 'Sin fecha';const [y,m,d]=s.split('-');return `${d}/${m}/${y}`};
    const dueText=t=>t.due?(t.due<today()?`Vencida · ${shortDate(t.due)}`:t.due===today()?'Hoy':shortDate(t.due)):'Sin vencimiento';
    function header(kicker,title,desc,action=''){return `<div class="section-header"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3400)}
    function makeNav(){const b=navItems.map(([id,label,icon])=>`<button class="nav-btn ${id===currentView?'active':''}" data-view="${id}" aria-current="${id===currentView?'page':'false'}">${ico(icon)}<span>${label}</span></button>`).join('');document.getElementById('desktopNav').innerHTML=b;document.getElementById('mobileNav').innerHTML=navItems.filter(([id])=>id!=='settings').map(([id,label,icon])=>`<button data-view="${id}" class="${id===currentView?'active':''}" aria-label="${label}">${ico(icon,19)}<span>${id==='overview'?'Panel':id==='study'?'Estudio':id==='tasks'?'Tareas':id==='training'?'Gym':'Proyectos'}</span></button>`).join('')+`<button data-view="settings" aria-label="Configuración" class="${currentView==='settings'?'active':''}">${ico('settings',19)}<span>Ajustes</span></button>`}
    function navigate(view){if(!navItems.some(x=>x[0]===view))return;currentView=view;document.querySelectorAll('.view').forEach(el=>el.classList.toggle('active',el.id==='view-'+view));document.getElementById('crumb').textContent=(navItems.find(x=>x[0]===view)?.[1]||'PANEL').toUpperCase();makeNav();render();window.scrollTo({top:0,behavior:'smooth'})}
    function taskHtml(t,deleteButton=true){const dateClass=t.due&&!t.done&&t.due<today()?'red':t.priority==='Alta'?'amber':'';return `<div class="task ${t.done?'done':''}"><button class="task-check ${t.done?'complete':''}" data-check="${esc(t.id)}" title="${t.done?'Marcar pendiente':'Marcar completada'}" aria-label="${t.done?'Desmarcar tarea':'Completar tarea'}">${t.done?ico('check',13):''}</button><div class="task-text"><div class="task-title">${esc(t.name)}</div><div class="task-details"><span class="chip">${esc(t.area)}</span><span class="chip ${dateClass}">${esc(dueText(t))}</span>${t.priority==='Alta'?'<span style="color:var(--amber)">● Prioridad alta</span>':''}</div></div>${deleteButton?`<button class="icon-btn" title="Eliminar tarea" aria-label="Eliminar tarea" data-delete="${esc(t.id)}">${ico('trash')}</button>`:''}</div>`}
    function subjectRows(limit=5){return state.subjects.slice(0,limit).map((s,i)=>`<div class="subject-row"><div class="subject-icon">${ico(['activity','layers','target','briefcase','book'][i%5])}</div><div class="subject-main"><div class="subject-name">${esc(s.name)}</div><div class="track"><div class="fill" style="width:${Math.min(100,Math.max(0,Number(s.percent)||0))}%"></div></div></div><div class="subject-percent">${Math.round(s.percent)}%</div></div>`).join('')}
    function gymDays(){const start=new Date(weekStart()+'T12:00:00');const wk=state.gym[weekStart()]||{};return ['L','M','M','J','V','S','D'].map((day,i)=>{let d=new Date(start);d.setDate(d.getDate()+i);const key=dateISO(d);return `<button class="gym-day ${wk[key]?'checked':''}" data-gym="${key}" aria-label="${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'][i]} ${wk[key]?'entrenado':'sin registrar'}"><span>${day}</span><strong>${wk[key]?ico('check',13):d.getDate()}</strong></button>`}).join('')}
    function chartHtml(){const days=past7(),arr=days.map(day=>state.sessions.filter(s=>s.date===day).reduce((a,s)=>a+Number(s.minutes),0)),max=Math.max(45,...arr);return `<div class="chart-bars">${days.map((day,i)=>`<div class="bar-col" title="${shortDate(day)}: ${arr[i]} minutos"><div class="bar" style="height:${Math.max(3,Math.round((arr[i]/max)*87))}px;${arr[i]===0?'background:#1a4857;':''}"></div><div class="bar-label">${['D','L','M','M','J','V','S'][new Date(day+'T12:00:00').getDay()]}</div></div>`).join('')}</div><div style="height:18px"></div>`}
    function renderOverview(){const pending=state.tasks.filter(t=>!t.done);const thisWeek=weeklyStudy();const active=state.projects.filter(p=>p.status!=='En pausa'&&p.status!=='Completado').length;document.getElementById('view-overview').innerHTML=`
      <div class="hero"><div class="hero-body"><div class="eyebrow">● CONTROL PERSONAL / SISTEMA INICIADO</div><h1>Tu día.<br><em>Bajo control.</em></h1><p>Universidad, metas y proyectos en un solo lugar. Menos ruido, más foco.</p><div class="hero-actions"><button class="btn primary" data-action="briefing">${ico('volume')} Ejecutar briefing</button><button class="btn ghost" data-action="new-task">${ico('plus')} Nueva tarea</button></div></div><div class="orb-wrap" aria-hidden="true"><div class="orb-trace"></div><div class="orb"><div class="orb-inner"><span>G</span></div><div class="orb-label">ONLINE // GABI OS</div></div></div></div>
      <div class="stats"><div class="stat"><div class="stat-top"><span>Tareas pendientes</span><span class="stat-ico">${ico('list')}</span></div><div class="stat-number">${pending.length.toString().padStart(2,'0')}</div><div class="stat-sub">${pending.filter(t=>t.due&&t.due<=today()).length} para hoy o vencidas</div></div>
      <div class="stat"><div class="stat-top"><span>Estudio semanal</span><span class="stat-ico">${ico('book')}</span></div><div class="stat-number">${(thisWeek/60).toFixed(1).replace('.',',')} <span style="font-size:14px;color:#7398a7">h</span></div><div class="stat-sub">Sesiones de enfoque completadas</div></div>
      <div class="stat"><div class="stat-top"><span>Entrenamientos</span><span class="stat-ico">${ico('dumbbell')}</span></div><div class="stat-number">${gymCount()}<span style="color:#587b89;font-size:17px"> / ${state.weeklyGoal}</span></div><div class="stat-sub">Registro de esta semana</div></div>
      <div class="stat"><div class="stat-top"><span>Proyectos activos</span><span class="stat-ico">${ico('layers')}</span></div><div class="stat-number">${active.toString().padStart(2,'0')}</div><div class="stat-sub">${state.projects.length} proyectos registrados</div></div></div>
      <div class="dash-grid"><article class="panel"><div class="panel-head"><div><h2>Estado académico</h2><small>Porcentajes editables · estimaciones iniciales</small></div><button class="panel-link" data-view="study">Ver materias →</button></div>${subjectRows()}</article><article class="panel"><div class="panel-head"><div><h2>Prioridades</h2><small>Lo que todavía queda por hacer</small></div><button class="panel-link" data-view="tasks">Ver todas →</button></div><div class="task-list">${pending.sort(taskOrder).slice(0,4).map(t=>taskHtml(t,false)).join('')||'<div class="empty">No tenés tareas pendientes. ¡Bien ahí!</div>'}</div></article></div>
      <div class="lower-grid"><article class="panel"><div class="panel-head"><div><h2>Entrenamiento semanal</h2><small>Tocá un día para registrar actividad</small></div><button class="panel-link" data-view="training">Abrir →</button></div><div class="gym-week">${gymDays()}</div><div class="progress-line"><span>Meta semanal</span><strong style="color:var(--cyan)">${gymCount()}/${state.weeklyGoal}</strong></div><div class="track"><div class="fill" style="width:${Math.min(100,gymCount()/state.weeklyGoal*100)}%"></div></div></article><article class="panel"><div class="panel-head"><div><h2>Actividad de estudio</h2><small>Últimos 7 días · minutos de enfoque</small></div><button class="panel-link" data-view="study">Modo enfoque →</button></div>${chartHtml()}</article></div>`}
    function taskOrder(a,b){return Number(a.done)-Number(b.done)||((a.due||'9999')<(b.due||'9999')?-1:(a.due||'9999')>(b.due||'9999')?1:0)||({Alta:0,Media:1,Baja:2}[a.priority]??1)-({Alta:0,Media:1,Baja:2}[b.priority]??1)}
    function renderStudy(){document.getElementById('view-study').innerHTML=`${header('FORMACIÓN / SEGUIMIENTO','Universidad','Editá tu avance por materia y registrá minutos reales de estudio.')}
    <div class="nudge">${ico('shield')} Los porcentajes cargados son orientativos, no provienen de la UAI. Ajustalos según tu progreso real.</div>
    <div class="section-layout"><article class="panel"><div class="panel-head"><h2>Mis materias</h2><small>Avance manual</small></div>${state.subjects.map(s=>`<div class="study-card"><div style="min-width:0"><strong style="font-size:12px">${esc(s.name)}</strong><div class="study-desc">${esc(s.description)}</div><div class="track"><div class="fill" style="width:${Number(s.percent)}%"></div></div></div><div style="text-align:right"><div class="subject-percent" style="margin-bottom:8px">${s.percent}%</div><button class="btn ghost small" data-edit-subject="${esc(s.id)}">Editar</button></div></div>`).join('')}</article>
    <div style="display:grid;gap:17px;align-content:start"><article class="panel"><div class="panel-head"><h2>Modo enfoque</h2><small>Temporizador de estudio</small></div><div class="focus-small">OBJETIVO DE LA SESIÓN</div><div class="focus-big" id="focusDisplay">${timerText(focusRemaining)}</div><div class="focus-lengths">${[25,30,45,60].map(n=>`<button class="length-btn ${focusLength===n?'active':''}" data-focus-length="${n}" ${focusRunning?'disabled':''}>${n} min</button>`).join('')}</div><div class="focus-actions"><button class="btn primary" data-action="focus-toggle">${ico(focusRunning?'pause':'play')} ${focusRunning?'Pausar':'Comenzar'}</button><button class="btn ghost" data-action="focus-finish">${ico('check')} Registrar</button><button class="btn ghost" data-action="focus-reset" title="Reiniciar temporizador">${ico('reset')}</button></div><p class="subtitle" style="text-align:center">Al terminar, registrá tu sesión para sumar horas al dashboard.</p></article>
    <article class="panel"><div class="panel-head"><h2>Sesiones recientes</h2><small>Tiempo registrado</small></div>${state.sessions.slice().reverse().slice(0,5).map(s=>`<div class="session-row"><span>${esc(s.label||'Sesión de estudio')}<br><small>${shortDate(s.date)}</small></span><strong>${Number(s.minutes)} min</strong></div>`).join('')||'<div class="empty">Todavía no hay sesiones registradas.</div>'}</article></div></div>`}
    function timerText(secs){return `${pad(Math.floor(secs/60))}:${pad(secs%60)}`}
    function renderTasks(){const tasks=state.tasks.filter(t=>taskFilter==='Todas'||(taskFilter==='Pendientes'&&!t.done)||(taskFilter==='Completadas'&&t.done)||t.area===taskFilter).slice().sort(taskOrder);document.getElementById('view-tasks').innerHTML=`${header('ORGANIZACIÓN / ACCIÓN','Tareas y agenda','Creá, completá y organizá lo que tenés pendiente.',`<button class="btn primary" data-action="new-task">${ico('plus')} Nueva tarea</button>`)}<div class="panel"><div class="panel-head" style="align-items:flex-start;flex-wrap:wrap"><div><h2>Mis tareas</h2><small>${state.tasks.filter(t=>!t.done).length} pendientes · ${state.tasks.filter(t=>t.done).length} completadas</small></div><div class="pill-tabs">${['Todas','Pendientes','Completadas','Universidad','Mía y colegio','Personal','Trabajo','Hogar','Pagos'].map(s=>`<button class="pill ${taskFilter===s?'active':''}" data-task-filter="${s}">${s}</button>`).join('')}</div></div><div class="full-list">${tasks.map(t=>taskHtml(t)).join('')||'<div class="empty">No hay tareas en esta categoría.<br>Agregá una nueva para empezar.</div>'}</div></div>`}
    function renderTraining(){document.getElementById('view-training').innerHTML=`${header('HÁBITOS / DISCIPLINA','Entrenamiento','Marcá los días en los que realmente entrenaste. El contador se reinicia cada semana.')}
      <div class="section-layout"><article class="panel"><div class="panel-head"><h2>Semana actual</h2><small>De lunes a domingo</small></div><div class="gym-week">${gymDays()}</div><div class="progress-line"><span>Entrenamientos completados</span><strong style="color:var(--cyan)">${gymCount()} de ${state.weeklyGoal}</strong></div><div class="track"><div class="fill" style="width:${Math.min(100,gymCount()/state.weeklyGoal*100)}%"></div></div><p class="subtitle" style="margin-top:16px">${gymCount()>=state.weeklyGoal?'¡Objetivo semanal cumplido!':'Cada sesión cuenta. Marcá un día cuando hayas terminado de entrenar.'}</p></article><article class="panel"><div class="panel-head"><h2>Tu objetivo</h2><small>Editable</small></div><div class="field"><label for="weeklyGoal">Entrenamientos por semana</label><select id="weeklyGoal" class="select">${[1,2,3,4,5,6,7].map(n=>`<option value="${n}" ${state.weeklyGoal===n?'selected':''}>${n} días por semana</option>`).join('')}</select></div><p class="subtitle" style="margin-top:16px">El historial queda guardado localmente por semana. Se conserva aunque el calendario avance.</p></article></div>`}
    function renderProjects(){document.getElementById('view-projects').innerHTML=`${header('PLANIFICACIÓN / CONSTRUCCIÓN','Proyectos','Ideas y objetivos importantes, con su estado actual.',`<button class="btn primary" data-action="new-project">${ico('plus')} Nuevo proyecto</button>`)}<div class="section-layout">${state.projects.map(p=>`<article class="project-card"><div class="project-top"><strong>${esc(p.name)}</strong><span class="chip ${p.status==='Completado'?'green':p.status==='En pausa'?'amber':''}">${esc(p.status)}</span></div><p class="project-desc">${esc(p.description)}</p><div class="project-foot"><button class="btn ghost small" data-edit-project="${esc(p.id)}">${ico('edit')} Editar</button><button class="icon-btn" data-delete-project="${esc(p.id)}" title="Eliminar proyecto" aria-label="Eliminar proyecto">${ico('trash')}</button></div></article>`).join('')||'<div class="empty">No hay proyectos. ¡Creá el primero!</div>'}</div>`}
    function renderSettings(){document.getElementById('view-settings').innerHTML=`${header('PREFERENCIAS / DATOS','Configuración','Respaldo, importación y notas personales para mantener tu panel a tu manera.')}
    <div class="section-layout"><article class="panel"><div class="panel-head"><h2>Notas rápidas</h2><small id="notesStatus" class="notes-status">Guardado local</small></div><textarea id="quickNotes" class="text-area" placeholder="Ideas, recordatorios, próximos pasos...">${esc(state.notes)}</textarea><p class="subtitle" style="margin-top:10px">Se guarda automáticamente en este navegador.</p></article>
    <article class="panel"><div class="panel-head"><h2>Tus datos</h2><small>Privacidad y copias de seguridad</small></div><div class="warning">${ico('shield')} Los datos quedan en este navegador. No se sincronizan automáticamente con ChatGPT, WhatsApp, Google Calendar ni otros dispositivos. Si borrás los datos del sitio, pueden perderse.</div><div class="settings-actions"><button class="btn primary" data-action="export">${ico('download')} Exportar respaldo</button><button class="btn ghost" data-action="import">${ico('upload')} Importar respaldo</button></div><input id="importFile" type="file" accept="application/json,.json" style="display:none"><div class="stat-inline">${state.tasks.length} tareas · ${state.sessions.length} sesiones · ${state.projects.length} proyectos</div><div style="margin-top:25px;border-top:1px solid var(--line);padding-top:16px"><button class="btn danger small" data-action="reset-data">Restablecer datos de ejemplo</button></div></article>
    <article class="panel span-all"><div class="panel-head"><h2>Trabajar conmigo en ChatGPT</h2><small>Asistencia manual</small></div><p class="subtitle">Podés copiar un resumen de este panel y pegarlo en nuestro chat para que te ayude a priorizar tareas y estudiar. La página no tiene acceso directo a esta conversación.</p><div class="settings-actions"><button class="btn ghost" data-action="copy-summary">${ico('copy')} Copiar resumen para ChatGPT</button><a class="btn ghost" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">Abrir ChatGPT</a></div></article></div>`}
    function render(){renderOverview();renderStudy();renderTasks();renderTraining();renderProjects();renderSettings();document.getElementById('topGlyph').innerHTML=ico('activity');}
    function clock(){const d=new Date();document.getElementById('liveClock').textContent=d.toLocaleTimeString('es-AR',{hour12:false});document.getElementById('liveDate').textContent=d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'short'}).toUpperCase()}
    function openModal(title,content){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=content;document.getElementById('modalRoot').classList.add('open');document.querySelector('.modal input,.modal select,.modal textarea')?.focus()}
    function closeModal(){document.getElementById('modalRoot').classList.remove('open')}
    function modalTask(){openModal('Nueva tarea',`<form id="taskForm"><div class="field"><label for="taskName">¿Qué hay que hacer?</label><input id="taskName" name="name" class="text-input" placeholder="Ej: Entregar TP de Redes" maxlength="180" required></div><div class="form-grid"><div class="field"><label for="taskArea">Categoría</label><select id="taskArea" name="area" class="select">${['Universidad','Mía y colegio','Personal','Trabajo','Hogar','Pagos'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label for="taskPriority">Prioridad</label><select id="taskPriority" name="priority" class="select"><option>Media</option><option>Alta</option><option>Baja</option></select></div></div><div class="field"><label for="taskDue">Vencimiento (opcional)</label><input id="taskDue" name="due" type="date" class="text-input"></div><button type="submit" class="btn primary">${ico('plus')} Agregar tarea</button></form>`)}
    function modalSubject(id){const s=state.subjects.find(x=>x.id===id);if(!s)return;openModal('Actualizar materia',`<form id="subjectForm" data-id="${esc(s.id)}"><div class="field"><label for="subjectName">Materia</label><input id="subjectName" name="name" class="text-input" value="${esc(s.name)}" maxlength="100" required></div><div class="field"><label for="subjectDescription">Nota de seguimiento</label><input id="subjectDescription" name="description" class="text-input" value="${esc(s.description)}" maxlength="160"></div><div class="field"><label for="subjectPercent">Avance estimado: <strong id="percentValue">${s.percent}%</strong></label><input id="subjectPercent" name="percent" type="range" min="0" max="100" step="5" value="${s.percent}" style="width:100%;accent-color:var(--cyan)"></div><button type="submit" class="btn primary">Guardar cambios</button></form>`)}
    function modalProject(id){const p=state.projects.find(x=>x.id===id);openModal(p?'Editar proyecto':'Nuevo proyecto',`<form id="projectForm" data-id="${p?esc(p.id):''}"><div class="field"><label for="projectName">Nombre</label><input id="projectName" name="name" maxlength="100" class="text-input" value="${p?esc(p.name):''}" placeholder="Ej: App personal" required></div><div class="field"><label for="projectDescription">Descripción</label><textarea id="projectDescription" name="description" maxlength="350" class="text-area" style="min-height:100px">${p?esc(p.description):''}</textarea></div><div class="field"><label for="projectStatus">Estado</label><select name="status" id="projectStatus" class="select">${['En progreso','En uso','En pausa','Completado'].map(v=>`<option ${p?.status===v?'selected':''}>${v}</option>`).join('')}</select></div><button type="submit" class="btn primary">${ico('check')} Guardar proyecto</button></form>`)}
    function updateAndRender(){save();render()}
    function speakBriefing(){const pending=state.tasks.filter(t=>!t.done).sort(taskOrder);const urgent=pending.filter(t=>t.due&&t.due<=today());const msg=`Buenos días. Bienvenido a Gabi O S. Tenés ${pending.length} tareas pendientes, ${urgent.length} con vencimiento hoy o anterior. Esta semana acumulaste ${Math.round(weeklyStudy())} minutos de estudio y registraste ${gymCount()} entrenamientos de ${state.weeklyGoal}. ${pending.length?'La prioridad sugerida es: '+pending[0].name+'.':'Por ahora no hay tareas pendientes.'} Sistema listo. A trabajar.`;
      if('speechSynthesis' in window){window.speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(msg);voice.lang='es-AR';voice.rate=1.02;voice.pitch=.87;window.speechSynthesis.speak(voice);toast('Briefing iniciado · audio del navegador')}else{toast(msg)} }
    function resetFocus(){focusRunning=false;clearInterval(focusInterval);focusRemaining=focusLength*60;focusDeadline=null;renderStudy()}
    function updateFocusClock(){const el=document.getElementById('focusDisplay');if(el)el.textContent=timerText(focusRemaining)}
    function runFocus(){if(focusRunning){focusRemaining=Math.max(0,Math.ceil((focusDeadline-Date.now())/1000));focusRunning=false;clearInterval(focusInterval);focusDeadline=null;renderStudy();return}if(focusRemaining<=0)focusRemaining=focusLength*60;focusRunning=true;focusDeadline=Date.now()+focusRemaining*1000;focusInterval=setInterval(()=>{focusRemaining=Math.max(0,Math.ceil((focusDeadline-Date.now())/1000));if(focusRemaining<=0){focusRunning=false;clearInterval(focusInterval);focusDeadline=null;toast('Sesión completada. Registrá los minutos para guardarlos.');if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance('Sesión de enfoque completada');u.lang='es-AR';window.speechSynthesis.speak(u)}renderStudy()}else updateFocusClock()},1000);renderStudy()}
    function finishFocus(){if(focusRunning){focusRemaining=Math.max(0,Math.ceil((focusDeadline-Date.now())/1000))}const minutes=Math.max(1,Math.ceil((focusLength*60-focusRemaining)/60));if(focusRemaining===focusLength*60&&!confirm(`El temporizador todavía no empezó. ¿Querés registrar ${focusLength} minutos de estudio manualmente?`))return;const actual=focusRemaining===focusLength*60?focusLength:minutes;state.sessions.push({id:uid(),date:today(),minutes:actual,label:'Modo enfoque'});updateAndRender();resetFocus();toast(`Se registraron ${actual} minutos de estudio`)}
    function createSummary(){const pending=state.tasks.filter(t=>!t.done).sort(taskOrder);return `GABI OS — Estado al ${shortDate(today())}\n\nTareas pendientes (${pending.length}):\n${pending.map(t=>`- ${t.name} [${t.area}; prioridad ${t.priority}; ${dueText(t)}]`).join('\n')||'Sin pendientes'}\n\nMaterias:\n${state.subjects.map(s=>`- ${s.name}: ${s.percent}% — ${s.description}`).join('\n')}\n\nEsta semana: ${elapsedStr(weeklyStudy())} de estudio y ${gymCount()}/${state.weeklyGoal} entrenamientos.\n\nProyectos:\n${state.projects.map(p=>`- ${p.name}: ${p.status}`).join('\n')}\n\nNotas: ${state.notes||'Sin notas'}\n\nAyudame a elegir las 3 prioridades más importantes y armar un plan realista para hoy.`}
    async function copySummary(){try{await navigator.clipboard.writeText(createSummary());toast('Resumen copiado. Pegalo en nuestro chat.')}catch(e){const t=document.createElement('textarea');t.value=createSummary();document.body.append(t);t.select();try{document.execCommand('copy');toast('Resumen copiado.')}catch(e){toast('No se pudo copiar desde este navegador.')}t.remove()}}
    function exportData(){const b=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=`gabi-os-respaldo-${today()}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200);toast('Respaldo generado')}
    function importData(file){if(!file||file.size>2_000_000){toast('Archivo demasiado grande o inválido');return}file.text().then(s=>{const d=JSON.parse(s);if(!Array.isArray(d.tasks)||!Array.isArray(d.subjects)||!Array.isArray(d.projects)||!Array.isArray(d.sessions)||typeof d.gym!=='object'||!d.gym)throw Error('Formato no compatible');if(!confirm('Esto reemplazará los datos actuales del dashboard. ¿Continuar?'))return;state={...clone(defaultData),...d,weeklyGoal:Math.max(1,Math.min(7,Number(d.weeklyGoal)||4))};save();render();toast('Respaldo importado correctamente')}).catch(()=>toast('No se pudo importar: comprobá que sea un respaldo de GABI OS'))}
    document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){navigate(v.dataset.view);return}const b=e.target.closest('button');if(!b)return;const {action,check,delete:del,gym,editSubject,editProject,deleteProject,taskFilter:filter,focusLength:length}=b.dataset;
      if(check){const t=state.tasks.find(t=>t.id===check);if(t){t.done=!t.done;updateAndRender();toast(t.done?'Tarea completada':'Tarea reabierta')}return}
      if(del){const t=state.tasks.find(t=>t.id===del);if(t&&confirm(`¿Eliminar la tarea "${t.name}"?`)){state.tasks=state.tasks.filter(x=>x.id!==del);updateAndRender();toast('Tarea eliminada')}return}
      if(gym){const w=weekStart();state.gym[w]??={};state.gym[w][gym]=!state.gym[w][gym];updateAndRender();return}
      if(editSubject){modalSubject(editSubject);return}if(editProject){modalProject(editProject);return}
      if(deleteProject){const p=state.projects.find(x=>x.id===deleteProject);if(p&&confirm(`¿Eliminar proyecto "${p.name}"?`)){state.projects=state.projects.filter(x=>x.id!==deleteProject);updateAndRender()}return}
      if(filter){taskFilter=filter;renderTasks();return}if(length){focusLength=Number(length);resetFocus();return}
      if(action==='new-task')modalTask();else if(action==='new-project')modalProject();else if(action==='briefing')speakBriefing();else if(action==='focus-toggle')runFocus();else if(action==='focus-reset')resetFocus();else if(action==='focus-finish')finishFocus();else if(action==='copy-summary')copySummary();else if(action==='export')exportData();else if(action==='import')document.getElementById('importFile')?.click();else if(action==='reset-data'){if(confirm('¿Seguro que querés restaurar todos los datos de ejemplo? Se perderá tu información actual. Exportá un respaldo antes de continuar.')){state=clone(defaultData);resetFocus();updateAndRender();toast('Datos restablecidos')}}
    });
    document.addEventListener('submit',e=>{const f=e.target;if(!['taskForm','subjectForm','projectForm'].includes(f.id))return;e.preventDefault();const o=Object.fromEntries(new FormData(f));if(f.id==='taskForm'){if(!o.name?.trim())return;state.tasks.push({id:uid(),name:String(o.name).trim().slice(0,180),area:o.area,priority:o.priority,due:o.due||'',done:false});toast('Tarea agregada')}else if(f.id==='subjectForm'){const s=state.subjects.find(x=>x.id===f.dataset.id);if(s){s.name=String(o.name||'').trim().slice(0,100);s.description=String(o.description||'').trim().slice(0,160);s.percent=Math.min(100,Math.max(0,Number(o.percent)||0))}toast('Materia actualizada')}else{const values={name:String(o.name||'').trim().slice(0,100),description:String(o.description||'').trim().slice(0,350),status:o.status};if(!values.name)return;const p=state.projects.find(x=>x.id===f.dataset.id);if(p)Object.assign(p,values);else state.projects.push({id:uid(),...values});toast('Proyecto guardado')}closeModal();updateAndRender()});
    document.addEventListener('input',e=>{if(e.target.id==='subjectPercent'){const el=document.getElementById('percentValue');if(el)el.textContent=e.target.value+'%'}if(e.target.id==='quickNotes'){state.notes=e.target.value;clearTimeout(notesDebounce);notesDebounce=setTimeout(()=>{save();const el=document.getElementById('notesStatus');if(el)el.textContent='Guardado ✓'},350)}});
    document.addEventListener('change',e=>{if(e.target.id==='weeklyGoal'){state.weeklyGoal=Number(e.target.value);updateAndRender();toast('Objetivo semanal actualizado')}if(e.target.id==='importFile'){importData(e.target.files?.[0]);e.target.value=''}});
    document.getElementById('closeModal').innerHTML=ico('x');document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.id==='modalRoot')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    makeNav();render();clock();setInterval(clock,1000);
    if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  </script>
</body>
</html>
