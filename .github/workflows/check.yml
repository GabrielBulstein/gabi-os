name: Check pixel office
on:
  push:
    branches: ['dev/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          OFFICE_PREVIEW: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-office-preview
          path: dist
