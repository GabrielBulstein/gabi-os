name: Extract GABI OS website
on:
  workflow_dispatch:
  push:
    paths:
      - 'GABI-OS-v1.zip'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract website
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          with zipfile.ZipFile('GABI-OS-v1.zip') as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  p=pathlib.PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts: raise ValueError('Unsafe archive path')
                  parts=p.parts
                  if parts and parts[0]=='gabi-os': parts=parts[1:]
                  if not parts: continue
                  dest=pathlib.Path(*parts)
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(item))
          PY
      - name: Commit extracted site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Extract GABI OS site" && git push)
